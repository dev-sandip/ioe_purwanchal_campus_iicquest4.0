<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      padding: 2rem;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 2rem;
    }

    textarea {
      width: 100%;
      min-height: 200px;
      padding: 1rem;
      font-size: 1rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Demo</h1>

    <textarea
      placeholder="नेपाली भाषामा लेख्नुहोस्..."
    ></textarea>
  </div>
</body>
</html>
